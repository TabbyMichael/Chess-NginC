# Reverse-proxy snippet for the web bundle (REL-003: TLS terminates here).
# The API lives behind the same host; cookies stay first-party (REL-012).
server {
    listen 80;
    server_name _;

    # Redirect to HTTPS when a certificate is configured.
    # Uncomment after provisioning certs (REL-003):
    # return 301 https://$host$request_uri;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers for the static bundle.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
