# Development-only overrides (local dev).
#
# Usage:  docker compose -f compose.yaml -f compose.dev.yaml up --build
#
# Adds the Stockfish binary (installed from distro packages in the dev image) so
# engine moves and benchmarks work locally. The production compose file is unchanged
# and stays binary-free (GPL-3.0, REL-011).
#
# Note: compose merges `services` by name; only keys set here are overridden.
services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    environment:
      # Debian/Ubuntu place the stockfish binary here, which is NOT on PATH.
      # Uses explicit $VAR form so it is read from .env; set STOCKFISH_PATH in
      # .env to override (e.g. a locally-built binary).
      stockfish_path: ${STOCKFISH_PATH:-/usr/games/stockfish}
