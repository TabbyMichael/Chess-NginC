name: CI — backend & frontend gates (REL-010, QA-005..009)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: chess
          POSTGRES_USER: tabbymichael
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabbymichael -d chess"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          cd apps/api
          ruff check app tests scripts
          ruff format --check app tests scripts
      - name: Type check
        run: |
          cd apps/api
          mypy app
      - name: Migrate
        env:
          database_url: postgresql+psycopg://tabbymichael:postgres@localhost:5432/chess
        run: |
          cd apps/api
          alembic upgrade head
          alembic check
      - name: Coach index migration round-trip
        # Proves the coach_index stored generated tsvector column + GIN index
        # apply and reverse cleanly on a throwaway database (Phase 11). Runs
        # before the test suite, so the shared `chess` DB is left at head.
        env:
          database_url: postgresql+psycopg://tabbymichael:postgres@localhost:5432/chess_migrate_ci
        run: |
          cd apps/api
          admin_url="postgresql://tabbymichael:postgres@localhost:5432/postgres"
          psql "$admin_url" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE chess_migrate_ci'
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          psql "$admin_url" -v ON_ERROR_STOP=1 -c 'DROP DATABASE chess_migrate_ci'
      - name: Coach assistant tests
        # Explicit Phase 11 coverage: the long-context + RAG + HTTP surface, run
        # on their own so a coach regression names itself instead of hiding in
        # the aggregate suite.
        env:
          database_url: postgresql+psycopg://tabbymichael:postgres@localhost:5432/chess
        run: |
          cd apps/api
          pytest tests/ai -v
      - name: Tests
        env:
          database_url: postgresql+psycopg://tabbymichael:postgres@localhost:5432/chess
        run: |
          cd apps/api
          pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend
        run: |
          cd apps/web
          npm ci
      - name: Lint + types + tests + build
        run: |
          cd apps/web
          npm run lint
          npx tsc --noEmit
          npm run test:run
          npm run build
